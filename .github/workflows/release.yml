# main : si la version de package.json n'a pas encore de release, on compile les exécutables
# (Windows, macOS, Linux) et on publie la release « vX.Y.Z ».
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Version
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release v$V existe déjà : rien à publier (monte la version dans package.json)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.v.outputs.exists == 'false'
        with:
          bun-version: 1.2.21
      - name: Exécutables
        if: steps.v.outputs.exists == 'false'
        run: npm run build
      - name: Test de démarrage de l'exécutable Linux
        if: steps.v.outputs.exists == 'false'
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p /tmp/smoke && cp "dist/encavale-server-$V-linux-x64" /tmp/smoke/
          (cd /tmp/smoke && ./encavale-server-$V-linux-x64 --port 7999 < /dev/null > out.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:7999/info && break; sleep 1; done
          cat /tmp/smoke/out.log
          curl -sf localhost:7999/info > /dev/null
          grep -q "Simulation   : prêt" /tmp/smoke/out.log
          curl -sf localhost:7999/ | grep -q "__CAVALE_MP__"
      - name: Archives
        if: steps.v.outputs.exists == 'false'
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p out
          for f in dist/encavale-server-*; do
            name=$(basename "$f")
            target=${name#encavale-server-$V-}
            target=${target%.exe}
            mkdir -p "pkg/$target"
            cp "$f" "pkg/$target/"
            cp LISEZMOI.txt "pkg/$target/"
            if [[ "$target" == windows-* ]]; then
              (cd pkg && zip -qr "../out/encavale-server-$V-$target.zip" "$target")
            else
              chmod +x "pkg/$target/$name"
              tar -czf "out/encavale-server-$V-$target.tar.gz" -C pkg "$target"
            fi
          done
          ls -la out
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Serveur En Cavale v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            Serveur multijoueur d'En Cavale, à lancer sur ton PC ou un VPS.

            | Système | Fichier |
            |---|---|
            | Windows | `encavale-server-${{ steps.v.outputs.version }}-windows-x64.zip` |
            | Mac (Apple M1/M2/M3…) | `encavale-server-${{ steps.v.outputs.version }}-macos-arm64.tar.gz` |
            | Mac (Intel) | `encavale-server-${{ steps.v.outputs.version }}-macos-x64.tar.gz` |
            | Linux / VPS | `encavale-server-${{ steps.v.outputs.version }}-linux-x64.tar.gz` (ou `linux-arm64`) |

            Décompresse, lance l'exécutable, puis ouvre le port indiqué (7777 par défaut) sur ta box.
            Tout est expliqué dans le README du dépôt.
